question: What fields does a FAQ entry support?
category: Writing FAQs
order: 1
answer: |
  Each YAML file supports four fields:

  - **`question`** (required): question text, shown as plain text
  - **`answer`** (required): answer text, parsed as Markdown
  - **`category`** (optional): heading for a group of questions. Defaults to **General**
  - **`order`** (optional): position within a category. Lower numbers appear first

  See [Writing FAQ Entries](/docs/writing-faqs) for the full field reference and a complete example file.
