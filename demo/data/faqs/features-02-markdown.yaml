question: What Markdown is supported in answers?
category: Features
order: 2
answer: |
  Answers are parsed with [marked](https://github.com/markedjs/marked). You can use Markdown for **bold**, *italic*, `inline code`, links, lists, blockquotes, and fenced code blocks.

  HTML is rendered as-is. Docusaurus MDX features such as admonitions and React components are not available.
