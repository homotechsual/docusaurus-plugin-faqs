question: Why is my FAQ file being skipped?
category: Troubleshooting
order: 1
answer: |
  The plugin skips a file for either of these reasons and logs a warning during the build:

  1. **Invalid YAML.** Check indentation, quote special characters, and use `|` for a multi-line answer.
  2. **Missing or invalid fields.** Each entry needs string values for `question` and `answer`.

  See [Writing FAQ Entries](/docs/writing-faqs) for the correct file format and field reference.
