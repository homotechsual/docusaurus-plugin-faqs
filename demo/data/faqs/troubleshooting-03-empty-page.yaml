question: The FAQ page is empty but my YAML files exist
category: Troubleshooting
order: 3
answer: |
  Check that the plugin is reading from the directory that contains your FAQ files:

  1. The default `path` is `data/faqs`, relative to your site directory. If your files are elsewhere, set `path` in the plugin config. See [Configuration](/docs/configuration).
  2. The plugin reads only `.yaml` and `.yml` files. Other extensions, such as `.yml.bak` and `.txt`, are ignored.
